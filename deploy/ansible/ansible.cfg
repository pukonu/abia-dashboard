[defaults]
inventory = inventory.yml
collections_path = collections
host_key_checking = True
retry_files_enabled = False
result_format = yaml
# The host runs Ubuntu 18.04 (Python 3.6): ansible-core 2.16 is the newest
# release that still supports it (make deploy-setup pins it).
interpreter_python = /usr/bin/python3

[ssh_connection]
pipelining = True
